name: Nightly hygiene (10pm routine)

# Fires /api/cron/nightly — Jarvis's 10pm data-hygiene routine (contact
# harvest, dead-social repair, broken-draft rewrite). Moved here from the
# Vercel cron for the same reason as the morning dispatch: Vercel crons need a
# CRON_SECRET env var inside Vercel to authenticate, and were 401-ing
# silently. GitHub may run this late (schedules on this repo drift), which is
# fine — hygiene at 2am is as good as hygiene at 10pm, and the routine is
# capped + idempotent so even a rare double run is harmless.

on:
  schedule:
    - cron: "10 21 * * *" # 22:10 Irish summer; off-peak minute
  workflow_dispatch: {}

concurrency:
  group: nightly-hygiene
  cancel-in-progress: false

jobs:
  fire:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/cron/nightly
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set — add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://automateiq.ie/api/cron/nightly"
          echo "Nightly routine fired."
