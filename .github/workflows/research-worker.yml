name: Overnight research worker

# The self-driving pipeline. Each TICK hits /api/cron/research-worker, which
# researches up to 2 fresh prospects (or drafts due follow-ups) using the same
# runner as the on-page Research button.
#
# WHY A LOOP, NOT A 10-MINUTE SCHEDULE: GitHub delays this repo's scheduled
# runs by hours — the old "*/10 21-06" schedule fired exactly TWICE on the
# night of 16 Jul (59 expected ticks → 2), which meant 4 researched leads and
# an 8am run with only 4 emails. Schedules here are only STARTERS now: once
# any of them fires (even hours late), the job itself loops — tick, sleep
# ~9 min, tick — until 07:35 UTC, immune to scheduler delays. Public repo =
# runner minutes are free.
#
# The 6h job cap can't cover a 10.5h night, so two starters chain: the late
# starter queues behind the running job (concurrency group) and picks up when
# it ends. A daytime manual dispatch runs a 1-hour boost loop instead — a
# safe way to top up research by hand.
#
# The endpoint still stops itself instantly on account-level AI failures
# (daily quota / dead key), so a capped night just means quiet ticks.

on:
  schedule:
    - cron: "5 21 * * *" # night starter (21:05 UTC; may fire late — fine)
    - cron: "35 1 * * *" # second-half starter, queues behind the first
    - cron: "20 4 * * *" # late catch-up if GitHub skipped both
  workflow_dispatch: {} # manual: runs a 1-hour boost loop

# One loop at a time; late starters queue rather than overlap.
concurrency:
  group: research-worker
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # just under GitHub's 6h job cap
    steps:
      - name: Tick loop (every ~9 min until 07:35 UTC)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set — add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          NOW=$(date -u +%s)
          H=$(date -u +%H)
          # A MANUAL run (workflow_dispatch) is a fast, hands-off BOOST drain:
          # tick every 30s against ?boost=1 (3 leads/tick, in parallel) for up
          # to one hour, so a big import researches itself in ~1h with no
          # browser tab. A SCHEDULED run is the gentle overnight trickle:
          # 2 leads every ~9 min until 07:35 UTC, protecting free-tier quota.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            URL="https://automateiq.ie/api/cron/research-worker?boost=1"
            SLEEP=30
            END=$(( NOW + 3600 ))
            echo "MANUAL BOOST: draining fast (30s ticks, ?boost=1) for 1 hour."
          else
            URL="https://automateiq.ie/api/cron/research-worker"
            SLEEP=540
            # Overnight runs go until 07:35 UTC.
            if [ "$H" -ge 21 ]; then
              END=$(date -u -d "tomorrow 07:35" +%s)
            elif [ "$H" -lt 8 ]; then
              END=$(date -u -d "today 07:35" +%s)
            else
              END=$(( NOW + 3600 ))
            fi
          fi
          # Hard safety: never outlive the runner cap; a queued starter
          # (or tomorrow's) continues where this run stopped.
          CAP=$(( NOW + 20400 )) # 5h40m
          [ "$END" -gt "$CAP" ] && END=$CAP
          echo "Looping until $(date -u -d "@$END" '+%H:%M UTC')"
          TICK=0
          while [ "$(date -u +%s)" -lt "$END" ]; do
            TICK=$(( TICK + 1 ))
            echo "— tick ${TICK} at $(date -u '+%H:%M:%S UTC')"
            # Capture the body so a boost drain can stop the instant the queue
            # is empty (more:false) instead of ticking uselessly for the hour.
            BODY=$(curl -fsS --retry 2 --retry-delay 15 --max-time 120 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${URL}" \
              || echo '{"tick":"failed"}')
            echo "  ${BODY}"
            case "$BODY" in
              *'"more":false'*) echo "Queue drained (or AI account out) — stopping."; break ;;
            esac
            # Stop sleeping if the window is about to close.
            [ "$(( $(date -u +%s) + SLEEP ))" -ge "$END" ] && break
            sleep "$SLEEP"
          done
          echo "Loop finished after ${TICK} ticks."
