name: Morning brief (fire the 8am dispatch)

# The ONLY scheduler for the morning dispatch (queue top-up + send + brief).
# The Vercel cron was removed: it needs a CRON_SECRET env var INSIDE Vercel to
# authenticate, and the evidence (briefs only ever arriving when this action's
# delayed schedule fired at ~noon) says it was 401-ing silently. One scheduler,
# one source of truth.
#
# GitHub delays scheduled runs on this repo by 2.5–5 HOURS (observed run
# history: shots scheduled 07:45–09:40 routinely fired at noon or not at all).
# Waiting until the morning to schedule therefore means the send is hostage to
# that delay. The fix — same trick that made the overnight research worker
# reliable — is to schedule EARLY and make the runner SLEEP until the real
# target: shots start from 05:00 UTC, and whichever one GitHub actually starts
# sleeps until 07:40 UTC (08:40 Irish summer) before dispatching. A shot that
# GitHub starts late (even hours late) skips the sleep and dispatches
# immediately, so the delay lands inside the slack instead of after the target.
#
# A guard step makes whichever run reaches the dispatch first do the real work
# and every later run no-op — the dispatch must run exactly once per day
# (auto-queue tops the queue back up, so an unguarded second run would send a
# whole second batch). Manual runs (workflow_dispatch) skip the sleep, dispatch
# straight away, and count toward the guard.

on:
  schedule:
    # Early starters (UTC, off-peak minutes) + one late catch-up. Whichever
    # GitHub honours first sleeps until the 07:40 UTC target; the rest no-op.
    - cron: "0 5 * * *"
    - cron: "45 5 * * *"
    - cron: "30 6 * * *"
    - cron: "40 9 * * *"
  workflow_dispatch: {} # manual fire from the Actions tab (counts in the guard)

# Never let two runs overlap. A sleeping early shot holds this lock, so later
# shots queue behind it, wake after it dispatched, and no-op via the guard.
concurrency:
  group: morning-brief
  cancel-in-progress: false

permissions:
  actions: read

jobs:
  fire:
    runs-on: ubuntu-latest
    # Must outlast the longest sleep: 05:00 start → 07:40 target is 160 min.
    timeout-minutes: 200
    steps:
      - name: Sleep until the 07:40 UTC dispatch target
        if: github.event_name == 'schedule'
        run: |
          TARGET=$(date -u -d "$(date -u +%Y-%m-%d) 07:40:00" +%s)
          NOW=$(date -u +%s)
          if [ "$NOW" -lt "$TARGET" ]; then
            WAIT=$((TARGET - NOW))
            echo "Started early — sleeping ${WAIT}s until 07:40 UTC."
            sleep "$WAIT"
          else
            echo "Already past 07:40 UTC — dispatching immediately."
          fi
      - name: Skip if today's dispatch already ran
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          # Any successful run of THIS workflow that started today (scheduled
          # or manual), other than the current run, means the dispatch is done.
          #
          # FAIL-OPEN: if this API check errors for any reason, COUNT falls
          # back to 0 and the dispatch RUNS. A guard failure must never cause
          # a silent no-send morning (worst case of failing open is a
          # duplicate brief; worst case of failing closed is no emails and no
          # brief all day — which is the outage this guard exists to prevent).
          COUNT=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/morning-brief.yml/runs?status=success&created=%3E%3D${TODAY}&per_page=20" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.run_started_at >= \"${TODAY}\")] | length" \
            2>/dev/null || echo 0)
          case "$COUNT" in ''|*[!0-9]*) COUNT=0;; esac
          echo "successful runs already today: ${COUNT}"
          if [ "${COUNT}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Dispatch already ran today — no-op."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Hit /api/cron/dispatch
        if: steps.guard.outputs.skip == 'false'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set — add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://automateiq.ie/api/cron/dispatch"
          echo "Dispatch fired."
