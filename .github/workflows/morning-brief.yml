name: Morning brief (fire the 8am dispatch)

# Why this exists: Vercel Hobby cron jobs only run *within an hour* of the
# scheduled time and can skip a day, which made the 8am morning brief
# unreliable. This GitHub Action hits the same /api/cron/dispatch endpoint on
# a schedule (much tighter timing, free), so the brief + autopilot fire
# dependably. The endpoint is idempotent for outreach (queued emails are
# marked sent, so a second run sends nothing extra).

on:
  schedule:
    # 07:00 UTC = 08:00 Irish in summer (IST). In winter (GMT) it lands at
    # 07:00 Irish — same behaviour as the existing Vercel cron. Adjust to
    # "0 8 * * *" over winter if you want a fixed 8am wall-clock.
    - cron: "0 7 * * *"
  workflow_dispatch: {} # lets you fire it manually from the Actions tab too

# Never let two scheduled runs overlap.
concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  fire:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/cron/dispatch
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set — add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://automateiq.ie/api/cron/dispatch"
          echo "Dispatch fired."
